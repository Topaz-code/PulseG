[package]
name = "pulseg-studio"
version = "0.9.0"
description = "PulseG Studio - a desktop studio of AI agents that design, build and ship 2D Godot games"
authors = ["PulseG Studio"]
edition = "2021"
rust-version = "1.77"
default-run = "pulseg-studio"

# The window is a thin shell around two things: a webview showing the dashboard, and a Python
# sidecar doing all the work. Everything in this file exists to make those two reliable on a
# user's Windows machine - start together, stop together, and never leave an orphan process.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[features]
# Nothing custom yet; the default keeps `cargo build` honest for a plain checkout.
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
