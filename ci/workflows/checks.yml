# Everything that can be verified without Windows: the Python test suite, the type checker, the
# production bundle, the design-taste checklist and the API documentation.
#
# These are the checks that catch a regression before it reaches the installer build, which is slow
# and only runs on tags.
name: Checks

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt pyflakes

      - name: Lint
        run: python -m pyflakes backend scripts

      - name: Tests
        run: python -m pytest backend/tests -q

      - name: API surface unchanged
        run: python scripts/build_api_docs.py --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: View tests
        run: npm test

      - name: Design taste audit
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt
          python3 scripts/design_audit.py --check
