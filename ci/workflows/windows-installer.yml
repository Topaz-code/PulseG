# Build the installable Windows app.
#
# This is the workflow that produces the artifact the whole project is judged on: one
# PulseGStudio-Setup.exe that installs PulseG Studio into the Start Menu and the taskbar on a
# Windows machine. It cannot run in every environment (a Windows runner is required, and Rust
# toolchains are large), which is exactly why it lives here rather than only in a developer's
# shell history.
#
# Order matters:
#   1. icons  - a build fails without them, and they are generated, not downloaded
#   2. sidecar - PyInstaller freezes the Python backend into one executable
#   3. frontend - Vite builds dist/, which Tauri embeds
#   4. tauri  - links the shell, bundles everything, and emits the NSIS and MSI installers
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "backend/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-installer.yml"

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate the app icons
        run: python scripts/make_icons.py

      - name: Freeze the backend sidecar
        run: python scripts/build_backend.py

      - name: Verify the sidecar answers before packaging
        shell: pwsh
        run: |
          # A packaged app whose backend cannot start is worse than no app, so the frozen binary
          # is exercised here rather than discovered broken by a user.
          $env:PULSEG_HOME = "$env:RUNNER_TEMP\pulseg-home"
          $env:PULSEG_PROJECTS_ROOT = "$env:RUNNER_TEMP\pulseg-projects"
          $sidecar = Get-ChildItem src-tauri/binaries/pulseg-backend-*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $sidecar.FullName -ArgumentList "--port","8791" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $ok = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8791/api/health" -TimeoutSec 3
                if ($health.ok) { $ok = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "The frozen backend never answered /api/health." }
            Write-Host "Sidecar healthy: $($health.app) $($health.version)"
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build the installers
        run: npx tauri build --bundles nsis,msi

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: PulseGStudio-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
